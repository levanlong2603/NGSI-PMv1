# /etc/nginx/sites-available/ngsi
# Máy chủ chạy nhiều web nội bộ, mỗi web một cổng ngoài riêng qua Nginx.
# Web này (NGSI · Phòng Quản lý dự án) nghe ở cổng ngoài 8081, proxy vào Node nội bộ ở 127.0.0.1:3001.
# (Web "ptkt" – Phòng Kỹ thuật – là app anh em khác, chạy riêng ở cổng 8080 → 127.0.0.1:3000, xem
# nginx-ptkt.conf/ptkt.service nếu cần đối chiếu – KHÔNG dùng chung tiến trình/CSDL với web này.)
server {
    listen 8081;
    server_name _;

    client_max_body_size 10m;

    # Kênh cập nhật thời gian thực – không được đệm
    location /api/events {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
